version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netcore_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - netcore
    depends_on:
      - db
      - redis

  webserver:
    image: nginx:alpine
    container_name: netcore_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - netcore
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: netcore_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-netcore}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${DB_USERNAME:-netcore}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - netcore

  redis:
    image: redis:7-alpine
    container_name: netcore_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - netcore

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netcore_scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: sh -c "while true; do php artisan schedule:run >> /dev/null 2>&1; sleep 60; done"
    networks:
      - netcore
    depends_on:
      - app
      - db

networks:
  netcore:
    driver: bridge

volumes:
  dbdata:
    driver: local
